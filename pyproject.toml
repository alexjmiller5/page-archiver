[project]
name = "page-archiver"
version = "0.1.0"
license = "AGPL-3.0-or-later"
description = "Retain self-contained web pages and screenshots with durable capture delivery"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "playwright>=1.58,<2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=25.1",
]

[project.scripts]
page-archiver = "page_archiver.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/page_archiver"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.hatch.build]
artifacts = ["src/page_archiver/assets/*"]
